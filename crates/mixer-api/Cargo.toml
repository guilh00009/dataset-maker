[package]
name = "mixer-api"
edition.workspace = true
version.workspace = true
license.workspace = true

[dependencies]
anyhow = "1.0.104"
dirs = "7.0.0"
futures = "0.3.34"
keyring = "4.2.0"
mixer-core = { version = "0.1.0", path = "../mixer-core" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "sync", "time", "fs"] }

[dev-dependencies]
mixer-mock = { path = "../mixer-mock" }
tempfile = "3.27.0"
