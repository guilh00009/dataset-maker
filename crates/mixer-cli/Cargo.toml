[package]
name = "mixer-cli"
edition.workspace = true
version.workspace = true
license.workspace = true

[[bin]]
name = "mixer"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
axum = "0.8.9"
clap = { version = "4.6.7", features = ["derive", "env"] }
futures = "0.3.34"
mixer-api = { version = "0.1.0", path = "../mixer-api" }
mixer-core = { version = "0.1.0", path = "../mixer-core" }
mixer-mock = { version = "0.1.0", path = "../mixer-mock" }
serde = "1.0.229"
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "sync", "time", "signal"] }
tokio-stream = { version = "0.1.19", features = ["sync"] }
tower-http = { version = "0.7.1", features = ["fs"] }
